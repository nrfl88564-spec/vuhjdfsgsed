<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกข้อสอบ O-NET ม.3 V37</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--grid:#dbe4f3;--fg:#14213d;--mut:#5b6a86;--card:#fff;--bd:#c9d5ea;--ac:#1b4dd8;--acfg:#fff;--ok:#1b7a3e;--bad:#c0262d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--grid:#1a2540;--fg:#e8eefc;--mut:#98a6c6;--card:#17213a;--bd:#2c3a5e;--ac:#7aa2ff;--acfg:#0f1626;--ok:#5fd18a;--bad:#ff8087;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--grid:#1a2540;--fg:#e8eefc;--mut:#98a6c6;--card:#17213a;--bd:#2c3a5e;--ac:#7aa2ff;--acfg:#0f1626;--ok:#5fd18a;--bad:#ff8087;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#app{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:800;line-height:1.3;margin:12px 0 4px}
h2{font-size:1.1rem;margin:0 0 8px}
.m{color:var(--mut);margin:0 0 20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{font:inherit;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:16px;cursor:pointer;display:flex;flex-direction:column}
.c:hover,.c:focus-visible{border-color:var(--ac);outline:none}
.c span{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.q{font-size:1.1rem;margin:0 0 14px}
.o{display:block;width:100%;font:inherit;text-align:left;background:transparent;color:var(--fg);border:2px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.o.s{border-color:var(--ac);background:var(--grid)}
.f{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.f label{min-width:6.5em;color:var(--mut)}
input{flex:1;font:inherit;font-size:1.1rem;padding:9px 12px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
input:focus{outline:none;border-color:var(--ac)}
.k{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.k button{font:inherit;font-size:1.05rem;min-width:44px;height:40px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
.k button:active{background:var(--grid)}
.p{font:inherit;font-weight:600;background:var(--ac);color:var(--acfg);border:0;border-radius:8px;padding:12px 22px;cursor:pointer;margin-top:10px}
.p.l{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.r{border-left:5px solid var(--bd);padding:10px 14px;margin-bottom:12px;background:var(--card);border-radius:0 8px 8px 0}
.r.y{border-color:var(--ok)}.r.n{border-color:var(--bad)}
.r b.y{color:var(--ok)}.r b.n{color:var(--bad)}
.sc{font-size:3rem;font-weight:800;line-height:1.1}
.t{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}

#app{max-width:none;padding:14px clamp(14px,3vw,40px) 24px}
#rot{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;z-index:9;font-weight:600}
@media (orientation:portrait) and (max-width:900px){#rot{display:grid}}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.rail .c{flex:1 0 clamp(200px,26vw,320px);min-height:clamp(120px,34vh,260px);justify-content:flex-end;gap:4px}
.rail .c b{font-size:1.2rem}
.c.soon{opacity:.5;cursor:not-allowed;border-style:dashed}
.row{display:flex;gap:16px;align-items:flex-start}.row>*{flex:1;min-width:0}
.ex{display:flex;gap:20px;align-items:flex-start}.ex .qa{flex:1.2;min-width:0}.ex .an{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .o{width:auto;margin:0;border-radius:999px;padding:7px 16px}
@media (max-height:480px){h1{font-size:1.3rem;margin:4px 0}.m{margin-bottom:8px}.rail .c{min-height:96px}.card{padding:12px}}

/* ---- visual skin: navigation windows only ---- */

#app.nv{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#app.nv .stp{display:flex;gap:6px;align-items:center;padding:10px clamp(14px,3vw,40px);overflow-x:auto;flex:none}
#app.nv .stp button{font:inherit;font-size:.9rem;border:1.5px solid var(--bd);background:var(--card);color:var(--mut);border-radius:999px;padding:3px 14px;cursor:pointer;white-space:nowrap}
#app.nv .stp button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#app.nv .stp button:disabled{opacity:.45;cursor:default}
#app.nv .stp i{width:14px;height:1.5px;background:var(--bd);flex:none}
#app.nv .vp{flex:1;min-height:0;overflow:hidden}
#app.nv .trk{display:flex;height:100%;transition:transform .45s cubic-bezier(.65,0,.25,1)}
#app.nv .pn{flex:0 0 100%;height:100%;overflow:auto;padding:4px clamp(14px,3vw,40px) 24px;visibility:hidden;transition:visibility 0s .45s}
#app.nv .pn.on{visibility:visible;transition-delay:0s}
#app.nv .login{min-height:100%}
@media (prefers-reduced-motion:reduce){#app.nv .trk{transition:none}}
#app:not(.nv){max-width:1100px}
#app.nv{--bg:#E8EDF1;--grid:#DCE4EA;--fg:#12202B;--mut:#5A6B78;--card:#fff;--bd:#C9D3DB;--ac:#1F4FD8;--acfg:#fff;--ok:#2F7D6B;--bad:#C0262D;--gold:#F2B632;--sage:#2F7D6B;--soon:#D9E0E6;background:var(--bg);color:var(--fg);min-height:100vh;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app.nv{--bg:#0F1A22;--grid:#22333D;--fg:#E8EEF2;--mut:#9AABB7;--card:#18262F;--bd:#2C3E49;--ac:#6C8CFF;--acfg:#0F1A22;--ok:#5CC4A9;--bad:#FF8087;--sage:#5CC4A9;--soon:#22333D}}
:root[data-theme="dark"] #app.nv{--bg:#0F1A22;--grid:#22333D;--fg:#E8EEF2;--mut:#9AABB7;--card:#18262F;--bd:#2C3E49;--ac:#6C8CFF;--acfg:#0F1A22;--ok:#5CC4A9;--bad:#FF8087;--sage:#5CC4A9;--soon:#22333D}
#app.nv h1,#app.nv h2,#app.nv .sc,#app.nv .ttl{font-family:"Prompt","Sarabun",sans-serif}
#app.nv h1{font-size:clamp(1.4rem,4.5vh,2.2rem);font-weight:700;line-height:1.2;margin:0 0 4px}
#app.nv h2{font-size:1.05rem;font-weight:600}
#app.nv :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app.nv .card{border:1.5px solid var(--bd);border-radius:18px;padding:clamp(14px,3vh,26px)}
#app.nv .p{background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 26px}
#app.nv .p.l{background:transparent;color:var(--fg);border:1.5px solid var(--bd)}
#app.nv .p:disabled{opacity:.35;cursor:not-allowed}
#app.nv .o{border:1.5px solid var(--bd);border-radius:12px}
#app.nv .o.s{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
#app.nv .k button,#app.nv input{border-width:1.5px;border-radius:10px}
#app.nv .top{align-items:center;gap:12px;min-height:44px;border-bottom:1.5px solid var(--bd);padding-bottom:8px}
#app.nv .bar{height:6px;background:var(--bd)}.bar i{background:var(--gold)}
#app.nv .r{border-radius:0 12px 12px 0}
#app.nv .hd{display:flex;align-items:center;gap:14px;min-height:44px;margin-bottom:clamp(8px,2vh,18px)}
#app.nv .hd .sp{margin-left:auto;color:var(--mut)}
#app.nv .bk{font:inherit;color:var(--fg);border:1.5px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 14px;cursor:pointer}
#app.nv .sub{color:var(--mut);margin:2px 0 0}
#app.nv .rail .c{position:relative;border-radius:18px;padding:clamp(14px,3vh,24px);transition:transform .15s,border-color .15s}
#app.nv .rail .c:hover:not(.soon){transform:translateY(-3px);border-color:var(--ac)}
#app.nv .rail .c.soon{background:var(--soon);border-style:dashed}
#app.nv .c .ic{position:absolute;top:clamp(12px,3vh,22px);left:clamp(14px,3vh,24px);width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--ac);color:var(--acfg)}
#app.nv .c.sci .ic{background:var(--sage);color:#fff}.c.soon .ic{background:var(--mut);color:var(--bg)}
#app.nv .tag{align-self:flex-start;background:var(--gold);color:#12202B!important;font-weight:600;font-size:.85rem;padding:2px 12px;border-radius:999px}
#app.nv .bars{display:flex;gap:5px;margin-bottom:auto;padding-top:60px}.bars i{width:28px;height:10px;border-radius:5px;background:var(--bd)}.bars i.f{background:var(--gold)}
#app.nv .login{display:flex;gap:clamp(16px,4vw,56px);align-items:stretch;min-height:calc(100vh - 40px)}
#app.nv .login .lead{flex:1;display:flex;flex-direction:column;justify-content:center}
#app.nv .login .lead h1{font-size:clamp(2rem,8vh,3.4rem)}.login .lead p{color:var(--mut);max-width:30ch;margin-top:10px}
#app.nv .mark{width:56px;height:6px;background:var(--gold);border-radius:3px;margin-bottom:18px}
#app.nv .login .card{flex:1.25;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.4vh,20px)}
#app.nv .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg .o,.chips .o{margin:0}
#app.nv .login .p{align-self:flex-end}
@media (max-height:430px){#app.nv .login .lead p{display:none}#app.nv .rail .c span:not(.ic):not(.tag){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.kv{display:flex;gap:10px;margin-top:8px;align-items:flex-start}.kv>span{flex:0 0 7.5em;color:var(--mut);font-size:.9rem}.kv>div,.kv>b{flex:1;min-width:0}.r svg{max-width:340px;margin:8px 0}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}.fr>span{display:block;padding:0 3px}.fr>span:first-child{border-bottom:1.5px solid currentColor}
.sl ol{margin:4px 0 6px 22px;padding:0}.sl li{margin:3px 0;line-height:1.9}.sl.ez{background:var(--grid);border-radius:10px;padding:8px 12px;margin-top:8px;line-height:1.9}
/* ---- V37: พื้นที่สำหรับกราฟ ---- */
.gt{display:inline-block;width:150px;vertical-align:middle}.gt svg{width:100%;height:auto;margin:0}
.ex.big{flex-direction:column;align-items:stretch}.ex.big .qa,.ex.big .an{flex:none;width:100%}
.ex.big .qa svg{max-width:640px;width:100%;height:auto}.ex.big .qa table{font-size:1rem}
.an.gc{display:grid;grid-template-columns:1fr 1fr;gap:12px}.an.gc>.k{grid-column:1/-1}
.an.gc .o{margin:0;text-align:center;padding:10px}.an.gc .o .gt{display:block;width:100%;max-width:300px;margin:6px auto 0}
@media (max-width:560px){.an.gc{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="rot">กรุณาหมุนจอเป็นแนวนอน</div><div id="app"></div>
<script>

const NAV={role:'',purpose:'',subj:'',sn:'',ab:'math'};
const PU={student:['ฝึกทำข้อสอบ','เตรียมสอบ O-NET','ทบทวนบทเรียน','วัดระดับความรู้'],teacher:['หาข้อสอบให้นักเรียน','ตรวจเนื้อหาข้อสอบ','ติดตามผลนักเรียน','เตรียมสื่อการสอน']};
const hd=(t,sub,back,right)=>`<div class="hd">${back?`<button class="bk" onclick="${back}">‹ กลับ</button>`:''}<div><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${right||''}</div>`;
const tile=(cls,ic,t,d,on,soon)=>`<${soon?'div':'button'} class="c ${cls||''}${soon?' soon':''}" ${on?`onclick="${on}"`:''}><span class="ic" aria-hidden="true">${ic}</span><b>${t}</b>${soon?'<span class="tag">เร็วๆ นี้</span>':`<span>${d||''}</span>`}</${soon?'div':'button'}>`;
const LB=['เข้าสู่ระบบ','เมนูหลัก','เลือกวิชา','เลือกระดับ','ตั้งค่าสอบ'];
function pane(i,h){let t=document.getElementById('trk'),fresh=!t;
  if(fresh){app.className='nv';app.innerHTML='<nav class="stp" id="stp"></nav><div class="vp"><div class="trk" id="trk">'+LB.map((x,k)=>`<section class="pn" id="pn${k}" aria-label="${x}"></section>`).join('')+'</div></div>';t=document.getElementById('trk');t.style.transition='none'}
  document.getElementById('pn'+i).innerHTML=h;NAV.i=i;
  t.style.transform=`translateX(${-i*100}%)`;
  if(fresh){void t.offsetWidth;t.style.transition=''}
  document.querySelectorAll('.pn').forEach((e,k)=>{e.classList.toggle('on',k===i);e.inert=k!==i});
  const F=[login,hub,subjects,levels,start],st=document.getElementById('stp');
  st.innerHTML=LB.map((x,k)=>`${k?'<i></i>':''}<button class="${k===i?'on':''}" ${k>i?'disabled':''} onclick="NAV.fn(${k})">${x}</button>`).join('');
  NAV.fn=k=>{if(k<NAV.i||k===NAV.i)[login,hub,subjects,levels,start][k]()};
  const b=document.querySelector('#pn'+i+' button:not(:disabled)');if(b&&!fresh)b.focus({preventScroll:true})}
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null||!document.getElementById('trk'))return;const d=e.changedTouches[0].clientX-sx;sx=null;if(d>90&&NAV.i>=2)NAV.fn(NAV.i-1)},{passive:true});
function home(){clearInterval(T);NAV.role?hub():login()}
function login(){NAV.fresh='';const ch=(k,v,t)=>`<button class="o${NAV[k]===v?' s':''}" onclick="NAV.${k}='${v}';${k==='role'?"NAV.purpose='';":''}login()">${t}</button>`;
pane(0,`<div class="login"><div class="lead"><div class="mark"></div><h1>คลังข้อสอบ<br>วิชาสามัญ</h1><p>เลือกว่าคุณเป็นใคร และเข้ามาเพื่ออะไร แล้วเริ่มได้เลย</p></div><div class="card"><div><h2>คุณเป็น</h2><div class="seg" style="margin-top:8px">${ch('role','student','นักเรียน')}${ch('role','teacher','อาจารย์')}</div></div><div><h2>จุดประสงค์ที่เข้ามา</h2><div class="chips" style="margin-top:8px">${NAV.role?PU[NAV.role].map(p=>ch('purpose',p,p)).join(''):'<span class="sub">เลือกบทบาทก่อน</span>'}</div></div><button class="p" ${NAV.role&&NAV.purpose?'':'disabled'} onclick="hub()">เข้าสู่ระบบ</button><button class="p l" style="align-self:flex-start;padding:5px 12px;font-size:.85rem;margin:0" onclick="NAV.role='';admin()">ผู้ดูแลระบบ</button></div></div>`)}
function hub(){if(!NAV.role)return login();pane(1,hd('เมนูหลัก',NAV.purpose,'',`<span class="sp">${NAV.role==='teacher'?'อาจารย์':'นักเรียน'}</span><button class="bk" onclick="NAV.role='';login()">ออก</button>`)+`<div class="rail">${tile('','✎','ทำข้อสอบ','เลือกวิชาและระดับ แล้วเริ่มทำ','subjects()')}${tile('','≡','ดูรายละเอียด','',0,1)}${tile('','✉','ข้อมูลจากแอดมิน','',0,1)}</div>`)}
function subjects(){pane(2,hd('เลือกวิชา','วิชาสามัญ 5 วิชา','hub()')+`<div class="rail">${tile('','∑','คณิตศาสตร์','พร้อมใช้งาน',"NAV.subj='math';NAV.sn='คณิตศาสตร์';levels()")}${tile('sci','⚗','วิทยาศาสตร์','พร้อมใช้งาน',"NAV.subj='sci';NAV.sn='วิทยาศาสตร์';levels()")}${[['ก','ภาษาไทย'],['A','ภาษาอังกฤษ'],['⌂','สังคมศึกษา']].map(x=>tile('',x[0],x[1],'',0,1)).join('')}</div>`)}
function levels(){const lv=[['โรงเรียนทั่วไป','พื้นฐาน เหมาะกับการเริ่มต้นและทบทวน',1,0],['โรงเรียนประจำเมือง (O-NET)','ระดับ O-NET ตามมาตรฐานข้อสอบจริง',2,1],['โรงเรียนประจำจังหวัด','ยากสุด ใกล้เคียงระดับจุฬาฯ',3,0]];
pane(3,hd('เลือกระดับ · '+NAV.sn,'ระบบจะสุ่มโจทย์ใหม่ให้ทุกครั้งที่ทำ','subjects()')+`<div class="rail">${lv.map(([t,d,n,on])=>`<${on?'button':'div'} class="c${on?'':' soon'}" ${on?'onclick="start()"':''}><div class="bars">${[1,2,3].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</div><b>${t}</b>${on?`<span>${d}</span>`:'<span class="tag">เร็วๆ นี้</span>'}</${on?'button':'div'}>`).join('')}</div>`)}
const Q=[
{s:1,tp:'อัตราส่วน',q:'พ่อค้าบอกว่าอัตราส่วนจำนวนหมูต่อจำนวนไก่เป็น 3 : 5 ถ้าฟาร์มมีไก่ 1,000,000 ตัว ตามอัตราส่วนนี้ควรมีหมูกี่ตัว',a:[600000],sol:'หมู = 3/5 × 1,000,000 = 600,000 ตัว'},
{s:1,tp:'สมการกำลังสอง',q:'จงแก้สมการ x² − 9x + 14 = 0',l:['รากที่น้อยกว่า','รากที่มากกว่า'],a:[2,7],sol:'แยกตัวประกอบ (x − 2)(x − 7) = 0 จึงได้ x = 2 และ x = 7'},
{s:1,tp:'พื้นที่และปริมาตร',q:'วงกลมรัศมี 6 เซนติเมตร มีพื้นที่กี่ตารางเซนติเมตร',a:[36*Math.PI],d:'36π',sol:'พื้นที่ = πr² = π × 6² = 36π'},
{s:1,tp:'พีทาโกรัส',q:'สามเหลี่ยมมุมฉากมีด้านประกอบมุมฉากยาว 9 และ 12 หน่วย ด้านตรงข้ามมุมฉากยาวเท่าใด',o:['13','14','15','16'],a:2,sol:'√(9² + 12²) = √225 = 15'},

TQ('การแปลงทางเรขาคณิต','ข้อใดไม่ถูกต้อง<br>1. การสะท้อนจุด A(1, 2) โดยมีเส้นสะท้อนเป็นแกน X จะได้จุด A′(−1, −2)<br>2. การสะท้อนจุด B(3, 3) โดยมีเส้นสะท้อนเป็นแกน Y จะได้จุด B′(−3, 3)<br>3. การเลื่อนขนานจุด B(3, 3) ตามแนวแกน X ไปทางขวา 3 หน่วย และตามแนวแกน Y ไปข้างล่าง 2 หน่วย จะได้จุด B′(6, 1)<br>4. การเลื่อนขนานจุด C(2, 4) ตามแนวแกน X ไปทางขวา 3 หน่วย และตามแนวแกน Y ไปข้างล่าง 2 หน่วย จะได้จุด C′(5, 2)','ข้อ 1',['ข้อ 2','ข้อ 3','ข้อ 4'],'การสะท้อนผ่านแกน X ได้ A′(1, −2) ไม่ใช่ (−1, −2) ส่วนข้ออื่นถูกต้อง'),
TQ('ค่าเฉลี่ยเลขคณิต','คะแนนสอบวิชาคณิตศาสตร์ของนักเรียน 6 คน คือ 4, 8, X, 8, 9, 13 ถ้าค่าเฉลี่ยเลขคณิตของข้อมูลชุดนี้เท่ากับ 9 แล้ว (1/2)X + 5 มีค่าเท่ากับข้อใด','11',['10','12','17'],'ผลรวม 9 × 6 = 54 จาก 4 + 8 + 8 + 9 + 13 = 42 ได้ X = 12 จึง 12/2 + 5 = 11'),
TQ('ความน่าจะเป็น','ห้างสรรพสินค้าแห่งหนึ่งกำหนดให้ลูกค้าที่มาใช้บริการจับสลากบัตรส่วนลดจากกล่องใบใหญ่คนละ 1 ใบ ในกล่องมีบัตรมูลค่า 800 บาท 15 ใบ 500 บาท 15 ใบ 300 บาท 26 ใบ และ 100 บาท 24 ใบ ความน่าจะเป็นที่ลูกค้าคนแรกจะจับได้สลากบัตรส่วนลดมูลค่าไม่น้อยกว่า 300 บาท เป็นเท่าใด','7/10',['3/8','3/10','13/40'],'จำนวนบัตรทั้งหมด 80 ใบ บัตรที่มูลค่า ≥ 300 บาท มี 15 + 15 + 26 = 56 ใบ ความน่าจะเป็น = 56/80 = 7/10'),
NQ('รากและเลขยกกำลัง','√(∛(√(27 × 81 × 3⁵))) − ∛(−125) มีค่าเท่าใด','8',[2,10,14],'27 × 81 × 3⁵ = 3¹² จึง √ได้ 3⁶ = 729 ∛729 = 9 √9 = 3 และ −∛(−125) = 5 รวม 8'),
NQ('ความเข้มข้นและสัดส่วน','ผสมแอลกอฮอล์เจล 500 มิลลิลิตร มีส่วนผสมเอทิลแอลกอฮอล์ กลีเซอรีน และน้ำสะอาด โดยปริมาณของน้ำสะอาดที่ใช้เป็น 4 เท่าของปริมาณกลีเซอรีน และปริมาณของเอทิลแอลกอฮอล์เป็น 3 เท่าของปริมาณน้ำสะอาดและกลีเซอรีนรวมกัน ถ้าในส่วนผสมนี้มีเอทิลแอลกอฮอล์ทั้งหมด 375 มิลลิลิตร แล้วจะมีน้ำสะอาดในส่วนผสมกี่มิลลิลิตร','100',[50,200,400],'ให้กลีเซอรีน g น้ำสะอาด 4g เอทิล 3(5g) = 15g = 375 ได้ g = 25 จึงน้ำสะอาด = 100 มิลลิลิตร'),
NQ('ลำดับและอนุกรม','ข้อมูลชุดหนึ่งประกอบด้วยจำนวนเต็มบวก 4 จำนวน ถ้าฐานนิยม มัธยฐาน และพิสัยของข้อมูลชุดนี้เท่ากับ 6, 5 และ 4 ตามลำดับ แล้ว 2 เท่าของผลบวกของข้อมูลชุดนี้มีค่าเท่าใด','36',[18,24,72],'ข้อมูลคือ 2, 4, 6, 6 ผลบวก = 18 จึง 2 × 18 = 36'),

/* ===== 2566 ===== */
TQ('อัตราส่วน','ห้างสรรพสินค้าแห่งหนึ่งวางแผนการซื้อน้ำผลไม้กล่อง 3 รส เพื่อนำมาจำหน่าย โดยมีอัตราส่วนของน้ำฝรั่ง : น้ำองุ่น เป็น 3 : 5 และ น้ำฝรั่ง : น้ำส้ม เป็น 1 : 3 โดยน้ำส้มมีจำนวนมากกว่าน้ำองุ่น 480 กล่อง ห้างสรรพสินค้าแห่งนี้ซื้อน้ำผลไม้ทั้งหมดกี่กล่อง','2,040 กล่อง',['960 กล่อง','1,080 กล่อง','1,440 กล่อง'],'ให้น้ำฝรั่ง = 3f จะได้น้ำองุ่น = 5f และจากน้ำฝรั่ง : น้ำส้ม = 1 : 3 ได้น้ำส้ม = 9f ส้มมากกว่าองุ่น 4f = 480 ได้ f = 120 รวม 3f + 5f + 9f = 17f = 2,040 กล่อง'),
TQ('ตัวเลขยกกำลัง','หากข้อมูลรายได้ของรัฐ พบว่ามาจากกรมสรรพากร 2,085,300 ล้านบาท กรมสรรพสามิต 642,600 ล้านบาท และกรมศุลกากร 104,800 ล้านบาท รายได้รวมจากทั้ง 3 ส่วนมีมูลค่ากี่บาท','2.8327 × 10¹² บาท',['2.8327 × 10¹¹ บาท','9.5593 × 10¹¹ บาท','9.5593 × 10¹² บาท'],'รวม 2,832,700 ล้านบาท = 2.8327 × 10¹² บาท'),
TQ('พื้นที่และการใช้จ่าย','โรงเรียนแห่งหนึ่งต้องการทำสวน โดยแบ่งพื้นที่เป็นสองส่วน ส่วนที่ปูหญ้าคือบริเวณพื้นที่ที่ไม่ได้แรเงา และส่วนที่เป็นหินกรวดคือบริเวณพื้นที่ที่แรเงา (รูปประกอบ: สี่เหลี่ยมผืนผ้ากว้าง 4 เมตร ยาว 10 เมตร มีหินกรวดสองส่วนขนาด x × (x + 1) และ x × (x + 3)) ส่วนที่ปูหญ้าเสียค่าใช้จ่ายไปทั้งหมด 1,008 บาท ถ้าหินกรวดราคาถุงละ 60 บาท และหญ้าตารางเมตรละ 42 บาท แล้วข้อใดคือค่าใช้จ่ายรวมในการซื้อหญ้าและหินกรวดในการทำสวนนี้ (หมายเหตุ หินกรวด 1 ถุง ลงพื้นที่ได้ 0.5 ตารางเมตร)','2,928 บาท',['1,920 บาท','2,268 บาท','3,520 บาท'],'หญ้า 1,008 ÷ 42 = 24 ตารางเมตร หินกรวดจึงมี 40 − 24 = 16 ตารางเมตร ได้ x = 2 ใช้หินกรวด 16 ÷ 0.5 = 32 ถุง คิดเป็น 1,920 บาท รวมกับหญ้า 1,008 บาท เป็น 2,928 บาท'),
TQ('พาราโบลา','จากรูป คือโครงเหล็กแขวนดอกไม้รูปพาราโบลา มีระยะสูงสุด 4 เมตรจากพื้นและฐานกว้าง 4 เมตร ถ้าต้องการสร้างเหล็กยึดขาทั้งสองด้านของพาราโบลา สูงจากพื้น 3 เมตร แล้วเหล็กยึดยาวกี่เมตร','2 เมตร',['1.5 เมตร','2.5 เมตร','3 เมตร'],'พาราโบลา y = 4 − x² เมื่อ y = 3 ได้ x = ±1 เหล็กยึดยาว 2 เมตร'),
TQ('สัดส่วนร้อยละ','จากการสอบถามนักเรียนจำนวน 3,000 คนในโรงเรียนแห่งหนึ่ง โดยให้เลือกอาหารที่ชอบเพียง 1 ประเภท ได้ผลดังนี้ เนื้อ 48.6%, หมู 22.4%, ปลา ..., ไก่ 10.6%, ผัก 0.9% รวม 100% มีนักเรียนที่ชอบรับประทานปลาทั้งหมดกี่คน','525 คน',['354 คน','495 คน','619 คน'],'ปลา = 100 − 48.6 − 22.4 − 10.6 − 0.9 = 17.5% จึง 3,000 × 0.175 = 525 คน'),
TQ('อัตราส่วนและสมการ','ในการทำขนมชนิดหนึ่งต้องใช้นมกล่องรสหวานจำนวนมากกว่านมกล่องรสจืด 15 กล่อง ถ้าค่าเฉลี่ยของจำนวนนมกล่องทั้ง 2 ชนิด คือ 28.5 กล่อง แล้วต้องใช้นมกล่องรสจืดในการทำขนมทั้งหมดกี่กล่อง','21 กล่อง',['13.5 กล่อง','21.75 กล่อง','43.5 กล่อง'],'ให้รสจืด = p รสหวาน = p + 15 ค่าเฉลี่ย (2p + 15)/2 = 28.5 ได้ p = 21'),
TQ('พื้นที่และการตัด','ถ้าต้องการทำบัตรคอนเสิร์ตจำนวน 1,000 ใบ โดยแต่ละใบมีขนาดกว้าง 5 เซนติเมตร และยาว 15 เซนติเมตร ซึ่งตัดจากกระดาษโปสเตอร์แผ่นใหญ่ขนาดกว้าง 50 เซนติเมตร และยาว 90 เซนติเมตร แล้วจะต้องซื้อกระดาษโปสเตอร์จากร้านค้ามาใช้อย่างน้อยที่สุดกี่แผ่น (ร้านค้าจะไม่ตัดแบ่งกระดาษขาย)','17 แผ่น',['16 แผ่น','60 แผ่น','75 แผ่น'],'กระดาษ 1 แผ่นตัดได้ 10 × 6 = 60 ใบ 1,000 ÷ 60 ≈ 16.67 จึงต้องใช้ 17 แผ่น'),
TQ('ปริมาตรทรงกระบอก','นักเรียนกลุ่มหนึ่งเขียนโครงงานคณิตศาสตร์ออกแบบบันไดสำเร็จรูปด้วยการนำแท่งคอนกรีตมาประกอบกัน โดยแต่ละแท่งเป็นคอนกรีตทรงสี่เหลี่ยมมุมฉากกว้าง 8 นิ้ว ยาว 21 นิ้ว และสูง 8 นิ้ว ด้านในเป็นรูปทรงกระบอกกลวงมีระยะห่างจากขอบ α นิ้ว ถ้า 1 แท่งใช้คอนกรีตหล่อทั้งหมด 750 ลูกบาศก์นิ้ว แล้วรัศมีของทรงกระบอกยาวกี่นิ้ว (กำหนด π = 22/7)','3 นิ้ว',['2 นิ้ว','4 นิ้ว','6 นิ้ว'],'ปริมาตรแท่ง 8 × 8 × 21 = 1,344 ปริมาตรรูทรงกระบอก = 1,344 − 750 = 594 = (22/7) r² × 21 ได้ r² = 9 จึง r = 3 นิ้ว'),
TQ('ปริมาตรและพื้นที่ผิว','โรงเรียนต้องการสร้างกระโจมแปลงเกษตรทรงพีระมิดฐานจัตุรัส มีความสูงเท่ากับความกว้างของฐาน ด้านในมีท่อน้ำเพื่อติดระบบรดน้ำอัตโนมัติตรงกลางและสูงครึ่งหนึ่งของกระโจม ถ้าใช้วัสดุสำหรับสร้างกระโจม 25√5 ตารางเมตร (ไม่รวมฐานที่เป็นพื้นดิน) แล้วท่อน้ำสูงกี่เมตร','2.5 เมตร',['1.5 เมตร','1.8 เมตร','2.2 เมตร'],'พื้นที่ผิวข้าง = a²√5 = 25√5 ได้ a = 5 ความสูง = 5 ท่อน้ำสูงครึ่งหนึ่ง = 2.5 เมตร'),
TQ('รูปเรขาคณิตสามมิติ','กำหนดพีระมิดฐานสี่เหลี่ยมมุมฉาก ข้อใดไม่ใช่หน้าตัดที่เกิดจากการตัดพีระมิดฐานสี่เหลี่ยมมุมฉากด้วยระนาบ (ตัวเลือก: 1. หกเหลี่ยม 2. สี่เหลี่ยมจัตุรัส 3. สี่เหลี่ยมคางหมู 4. สามเหลี่ยม)','รูปหกเหลี่ยม',['รูปสี่เหลี่ยมจัตุรัส','รูปสี่เหลี่ยมคางหมู','รูปสามเหลี่ยม'],'พีระมิดฐานสี่เหลี่ยมมี 5 หน้า หน้าตัดมีได้ไม่เกิน 5 ด้าน จึงไม่มีหน้าตัดรูปหกเหลี่ยม'),
TQ('ความยาวส่วนโค้ง','นาฬิกาทรงกลมเรือนหนึ่งมีเข็มวินาทียาว 7 เซนติเมตร โดยเข็มวินาทีเคลื่อนที่หมุนแบบต่อเนื่อง เมื่อเวลาผ่านไป 4 นาที จุดตรงปลายเข็มวินาทีจะหมุนเป็นระยะทางประมาณกี่เซนติเมตร (กำหนด π = 22/7)','176 เซนติเมตร',['22 เซนติเมตร','44 เซนติเมตร','88 เซนติเมตร'],'4 นาที = 4 รอบ ระยะทาง = 4 × 2π × 7 = 4 × 44 = 176 เซนติเมตร'),
TQ('ตรีโกณมิติ','บันไดวางพาดกำแพงโดยทำมุม 30 องศากับผนังกำแพงในแนวตั้ง ถ้าบันไดยาว 6 เมตร แล้วปลายอีกด้านของบันไดอยู่ห่างจากฐานกำแพงกี่เมตร','3 เมตร',['3√2 เมตร','3√3 เมตร','6 เมตร'],'ระยะห่างจากฐานกำแพง = 6 sin 30° = 6 × 1/2 = 3 เมตร'),
TQ('พื้นที่สามเหลี่ยมคล้าย','จากรูป สามเหลี่ยม TRP มีมุม TRP และ QSP เป็นมุมฉาก RS = 5, SP = 4 และ QS = 8 (ความยาวมีหน่วยเป็นเซนติเมตร) จากข้อมูลข้างต้น พื้นที่ของรูปสามเหลี่ยม TRP มีขนาดกี่ตารางเซนติเมตร','81 ตารางเซนติเมตร',['20.25 ตารางเซนติเมตร','45 ตารางเซนติเมตร','50.63 ตารางเซนติเมตร'],'สามเหลี่ยม PSQ คล้าย PRT ได้ QS/TR = SP/RP จึง 8/TR = 4/9 ได้ TR = 18 พื้นที่ = ½ × 9 × 18 = 81'),
TQ('มัธยฐาน','นักเรียนที่อยู่ชมรมรักษ์โรงเรียนกลุ่มหนึ่ง มีอายุ 9, 12, 10, 14 ปี และมีฝาแฝดอีก 3 คนรวมอยู่ด้วย ถ้าอายุเฉลี่ยของนักเรียนกลุ่มนี้เท่ากับ 12 ปี ดังนั้นมัธยฐานของอายุของนักเรียนทั้ง 7 คน เท่ากับข้อใด','13 ปี',['9 ปี','9.5 ปี','14 ปี'],'ผลรวม 84 − 45 = 39 ฝาแฝดแต่ละคนอายุ 13 ปี เรียงได้ 9, 10, 12, 13, 13, 13, 14 มัธยฐาน = 13'),
TQ('ความน่าจะเป็น','เด็กหญิง JANE ซื้อขนมปังมา 1 กล่อง ในกล่องเป็นขนมปังที่เป็นรูปตัวอักษรภาษาอังกฤษ A-Z ครบทั้ง 26 ตัวอักษร แต่ละตัวอักษรมีจำนวน 5 ชิ้นเท่ากัน เมื่อเปิดกล่องแล้วเด็กหญิง JANE หยิบขนมในกล่องเป็นครั้งแรกจำนวน 1 ชิ้น ผลต่างของความน่าจะเป็นที่จะหยิบได้ตัวอักษรที่อยู่ในชื่อกับหยิบไม่ได้ตัวอักษรที่อยู่ในชื่อของตนเองเป็นเท่าใด','9/13',['2/13','4/13','11/13'],'ตัวอักษรในชื่อ J A N E มี 4 ตัว P(อยู่ในชื่อ) = 20/130 P(ไม่อยู่) = 110/130 ผลต่าง = 90/130 = 9/13'),
NQ('เลขยกกำลัง','√(144x¹¹y¹⁰z⁹) × √(9x⁻²y⁻²z⁻⁵) ÷ √(36x⁹y⁸z⁴) มีค่าเท่าใด','6',[5,12,36],'ภายในรากเป็น 1296x⁹y⁸z⁴ ÷ 36x⁹y⁸z⁴ จึงได้ √(36) ÷ √(36) × √(...) = 6'),
NQ('สมการ','สมใจเล่นเกมทายตัวเลขกับเพื่อน โดยสมใจจะเลือกจำนวนสองจำนวน แล้วบอกคำใบ้ว่า สองเท่าของจำนวนน้อยมีค่ามากกว่าจำนวนมากอยู่ 8 และสองเท่าของจำนวนมากมีค่ามากกว่าสามเท่าของจำนวนน้อยอยู่ 2 แล้วผลบวกของจำนวนทั้งสองมีค่าเท่าใด','46',[36,28,54],'ให้น้อย s มาก L: 2s − L = 8 และ 2L − 3s = 2 ได้ s = 18 L = 28 ผลบวก = 46'),
NQ('เรขาคณิต','จากรูปสามเหลี่ยม PQR เป็นรูปสามเหลี่ยมที่มีมุม R เป็นมุมฉาก มีด้าน QR ยาว 10√3 หน่วย และด้าน PQ ยาว 20 หน่วย ถ้าลากเส้นตรงจากจุด R ไปตั้งฉากกับด้าน PQ ที่จุด S แล้ว √3 ของความยาวด้าน RS มีค่าเท่าใด','15',[14,20,30],'PR = 10 RS = (10√3 × 10)/20 = 5√3 จึง √3 × 5√3 = 15'),
NQ('ค่าเฉลี่ยและมัธยฐาน','จากการสำรวจคะแนนสอบวิชาคณิตศาสตร์ของนักเรียน 3 คน พบว่า ค่าเฉลี่ยเลขคณิตของคะแนนสอบของนักเรียนทั้ง 3 คน เท่ากับ 67 คะแนน มัธยฐานเท่ากับ 65 คะแนน และพิสัยเท่ากับ 18 คะแนน อยากทราบว่านักเรียนที่ได้คะแนนต่ำสุดได้คะแนนเท่าใด','59',[65,67,71],'ผลรวม 201 มัธยฐาน 65 ให้ต่ำสุด a และสูงสุด a + 18 ได้ a + (a + 18) = 136 จึง a = 59'),

/* ===== 2568 ===== */
TQ('อัตราส่วน','บริษัทเอกชนแห่งหนึ่งเปิดรับสมัครพนักงานในตำแหน่งผู้จัดการสาขา โดยมีอัตราส่วนของจำนวนผู้สมัครเพศชายต่อจำนวนผู้สมัครเพศหญิงเป็น 7 : 9 ถ้ามีจำนวนผู้สมัครทั้งหมด 320 คน จำนวนผู้สมัครเพศชายมีจำนวนน้อยกว่าเพศหญิงกี่คน','40 คน',['100 คน','140 คน','180 คน'],'ชาย = 320 × 7/16 = 140 หญิง = 180 ต่างกัน 40 คน'),
TQ('ตัวเลขยกกำลัง','ข้อมูลการส่งออกสินค้าจากกระทรวงพาณิชย์ ประจำปี 2566 สินค้าที่มีมูลค่าการส่งออกสูงที่สุดคือรถยนต์ อุปกรณ์และส่วนประกอบประมาณ 1,110,044 × 10⁶ บาท รองลงมาคือสินค้าประเภทอัญมณีและเครื่องประดับประมาณ 509,829 × 10⁶ บาท มูลค่าการส่งออกสินค้าทั้งสองประเภทต่างกันกี่บาท','6.002150 × 10¹¹ บาท',['1.619873 × 10¹² บาท','6.002150 × 10¹² บาท','1.619873 × 10¹¹ บาท'],'ผลต่าง = (1,110,044 − 509,829) × 10⁶ = 600,215 × 10⁶ = 6.002150 × 10¹¹ บาท'),
TQ('พื้นที่แรเงา','โรงเรียนต้องการสร้างสวนที่มีพื้นที่ส่วนที่แรเงารวมกันทั้งหมดเท่ากับ 8 ตารางเมตร โดยรูปสามเหลี่ยมที่แรเงามีพื้นที่เท่ากัน (รูปประกอบ: สี่เหลี่ยมจัตุรัสด้านยาว x ซ้อนกับสี่เหลี่ยมขนมเปียกปูนขนาดเท่ากัน) ถ้าให้ A เป็นส่วนที่ไม่ได้แรเงาและมีขนาดเป็น 8 + 8√2 ตารางเมตร ข้อใดถูกต้อง (√2 ≈ 1.414)','ค่าของ x มีค่ามากกว่า 4.5 และน้อยกว่า 5',['ค่าของ x มีค่ามากกว่าหรือเท่ากับ 5 และน้อยกว่า 5.5','ค่าของ x มีค่ามากกว่าหรือเท่ากับ 5.5 และน้อยกว่า 6','ค่าของ x มีค่ามากกว่าหรือเท่ากับ 6 และน้อยกว่า 6.5'],'ส่วนแรเงาทั้งหมด 2C = 8 ได้ C = 4 และ x² = A + C = 12 + 8√2 ≈ 23.31 จึง x ≈ 4.83'),
TQ('ความสัมพันธ์ของกราฟพาราโบลา','นักเรียนกลุ่มหนึ่งออกแบบคลองส่งน้ำรูปพาราโบลาซ้อนกัน ดังรูป (รูปประกอบ: y = ax² และ y = bx² มีจุดยอดที่ 0 ความกว้างรวม 20 เมตร ระดับพื้นดินสูง 10 เมตร) ข้อใดถูกต้อง (√2 ≈ 1.414)','m มีค่ามากกว่า 80b',['a มีค่ามากกว่า b','a และ b มีค่าเท่ากัน','m มีความยาวประมาณ 6 เมตร'],'a = 10/400 = 1/40 และ b = 5/100 = 1/20 จึง a < b ความกว้าง m = 10√2 − 10 ≈ 4.14 และ 80b = 4 ดังนั้น m > 80b'),
TQ('แผนภูมิวงกลม','แผนภูมิแสดงสัดส่วนของนักเรียนที่ชอบสีต่าง ๆ ของโรงเรียนแห่งหนึ่ง ถ้าโรงเรียนนี้มีนักเรียนทั้งหมด 3,900 คน แล้วจะมีคนชอบสีฟ้ากี่คน (สีน้ำเงิน 13%, สีแดง 44%, สีม่วง 16%, สีเขียว 11%)','507 คน',['858 คน','624 คน','429 คน'],'สีฟ้า (สีน้ำเงิน) 13% ของ 3,900 = 507 คน'),
TQ('ตารางข้อมูลผู้ป่วย','แผนภูมิแท่งแสดงอัตราผู้ป่วยจากการติดเชื้อไข้หวัดใหญ่จำแนกตามช่วงอายุต่อประชากรแสนคน (ช่วง 0–4 ปี = 2,858.70, 5–14 ปี = 2,541.15, 15–24 ปี = 681.42, 25–34 ปี = 648.11, 35–44 ปี = 623.07, 45–54 ปี = 413.18, 55–64 ปี = 349.50, 65+ ปี = 340.08) พิจารณาข้อความ 6.1 ช่วงอายุที่มีจำนวนประชากรติดเชื้อมากที่สุดคือช่วง 65 ปีขึ้นไป 6.2 ช่วงอายุ 0–4 ปี มากกว่าช่วงอายุ 5–14 ปี อยู่ 307.55 คนต่อประชากรแสนคน 6.3 ช่วงอายุ 65 ปีขึ้นไป น้อยกว่าช่วงอายุ 45–54 ปี อยู่ 73.1 คนต่อประชากรแสนคน 6.4 ช่วงอายุ 65 ปีขึ้นไป มากกว่าช่วงอายุ 15–24 ปี อยู่ 341.24 คนต่อประชากรแสนคน ข้อใดตอบ ใช่/ไม่ใช่ ได้ถูกต้องตามลำดับ','ไม่ใช่, ไม่ใช่, ใช่, ไม่ใช่',['ใช่, ไม่ใช่, ใช่, ไม่ใช่','ไม่ใช่, ใช่, ไม่ใช่, ไม่ใช่','ไม่ใช่, ไม่ใช่, ไม่ใช่, ใช่'],'6.1 ผิด (0–4 ปีมากที่สุด) 6.2 ผิด (ต่างกัน 317.55) 6.3 ถูก (340.08 ต่ำกว่า 413.18 อยู่ 73.10) 6.4 ผิด (340.08 น้อยกว่า 681.42)'),
TQ('ความแปรผัน','ในการจัดสวนแห่งหนึ่งต้องใช้ดอกกุหลาบมากกว่าดอกมะลิอยู่ 120 ต้น โดยดอกกุหลาบมีราคาต้นละ 80 บาท ส่วนดอกมะลิราคาต้นละ 30 บาท ถ้าเจ้าของสวนซื้อต้นไม้ทั้งสองชนิดรวมเป็นเงิน 18,400 บาท แล้วเขาจะได้ต้นไม้รวมทั้งหมดกี่ต้น','280 ต้น',['390 ต้น','408 ต้น','426 ต้น'],'ให้มะลิ = m กุหลาบ = m + 120 ได้ 80(m + 120) + 30m = 18,400 จึง m = 80 รวม 280 ต้น'),
TQ('ระบบสมการ','ตั๋วคอนเสิร์ตธรรมดาราคา 1,000 บาท และตั๋ว VIP ราคา 2,000 บาท งานคอนเสิร์ตมีผู้เข้าร่วมทั้งหมด 330 คน และรายได้รวมจากการขายตั๋วเท่ากับ 530,000 บาท ข้อใดคือผลต่างระหว่างจำนวนผู้ซื้อบัตรธรรมดากับผู้ซื้อบัตร VIP','70 คน',['20 คน','30 คน','50 คน'],'ให้ธรรมดา = s, VIP = v จะได้ s + v = 330 และ s + 2v = 530 ได้ v = 200 s = 130 ผลต่าง = 70 คน'),
TQ('ปริมาตรพีระมิด','ในการทำขนมเทียน 1 ห่อของร้านขนมแห่งหนึ่ง ต้องใช้แป้งขนมและไส้รวมกันแล้วห่อด้วยใบตองสำเร็จรูป 1 คู่ ให้ห่อด้วยใบตองเป็นรูปพีระมิดฐานสี่เหลี่ยมจัตุรัสกว้าง 5 เซนติเมตร สูง 4 เซนติเมตร โดยปริมาตรของแป้งขนมและไส้รวมกันคิดเป็น 3/4 ของปริมาตรพีระมิด ถ้าในการทำขนมเทียนทั้งหมดต้องใช้แป้งขนมบรรจุเต็มถังรูปทรงกระบอก รัศมี 15 เซนติเมตร สูง 30 เซนติเมตร และต้องใช้ไส้ที่บรรจุเต็มในถังรูปทรงกระบอกรัศมี 5 เซนติเมตร สูง 10 เซนติเมตร และใบตองสำเร็จรูป 1 คู่ ราคาคู่ละ 2 บาท แล้วต้องใช้เงินในการซื้อใบตองทั้งหมดกี่บาท (กำหนด π = 22/7)','1,760 บาท',['780 บาท','880 บาท','1,560 บาท'],'ปริมาตรพีระมิด = (1/3)(25)(4) = 100/3 แป้งและไส้ต่อห่อ = 3/4 × 100/3 = 25 ปริมาตรรวม = 6,750π + 250π = 7,000π = 22,000 จำนวนห่อ = 22,000/25 = 880 ห่อ ราคา 880 × 2 = 1,760 บาท'),
TQ('ปริมาตรทรงกลม','โรงงานผลิตแก้วไอศกรีมทรงกรวย รัศมีปากกรวย 5 เซนติเมตร สูง 12 เซนติเมตร หากต้องการปั้นไอศกรีมทรงกลม โดยให้ปริมาตรไอศกรีมทรงกลมเท่ากับปริมาตรกรวย ข้อใดต่อไปนี้คือรัศมีของไอศกรีมทรงกลม','∛75 เซนติเมตร',['4 เซนติเมตร','∛72 เซนติเมตร','5 เซนติเมตร'],'ปริมาตรกรวย = (1/3)π(25)(12) = 100π ทรงกลม (4/3)πR³ = 100π จึง R³ = 75'),
TQ('หน้าตัดของรูปทรงเรขาคณิต','กำหนดพีระมิดฐานสี่เหลี่ยมมุมฉาก ข้อใดไม่ใช่หน้าตัดที่เกิดจากการตัดพีระมิดด้วยระนาบ (ตัวเลือก: 1. หกเหลี่ยม 2. สี่เหลี่ยมจัตุรัส 3. สี่เหลี่ยมคางหมู 4. สามเหลี่ยม)','รูปหกเหลี่ยม',['รูปสี่เหลี่ยมจัตุรัส','รูปสี่เหลี่ยมคางหมู','รูปสามเหลี่ยม'],'พีระมิดฐานสี่เหลี่ยมมี 5 หน้า หน้าตัดได้ไม่เกิน 5 ด้าน จึงไม่มีรูปหกเหลี่ยม'),
TQ('มุมระหว่างคอร์ด','สวนสาธารณะแห่งหนึ่งเป็นรูปวงกลมรัศมี 100 เมตร มีทางเข้าที่จุด A และ B และมีทางออกที่จุด C และ D ทางเดินเป็นส่วนของเส้นตรงเชื่อมระหว่างทางเข้าและทางออก โดย AC ตัดกับ BD ที่จุด P (รูปประกอบ: ∠DAC = 32°, ∠BCA = 16°) ข้อใดคือขนาดของมุม APB','48°',['24°','32°','64°'],'∠APB = ½(ส่วนโค้ง AB + ส่วนโค้ง CD) = ½(2 × 16° + 2 × 32°) = 48°'),
TQ('พื้นที่และจำนวนแผ่น','สถาปนิกต้องการปูกระเบื้องให้เต็มพื้นที่ของที่พักผู้โดยสารรูปสี่เหลี่ยมคางหมูหน้าจั่ว ที่มีด้านขนานยาว 6 เมตร และ 4 เมตร มุมที่ฐาน 45 องศา สูง 1 เมตร หากกระเบื้องที่ใช้ปูพื้นแต่ละแผ่นกว้าง 50 เซนติเมตรและยาว 50 เซนติเมตร โดยที่กระเบื้องสามารถถูกตัดและนำมาต่อกันได้จนปิดพื้นที่ทั้งหมดพอดี และไม่มีเศษเหลือ ข้อใดคือจำนวนกระเบื้องที่ต้องใช้','20 แผ่น',['18 แผ่น','24 แผ่น','30 แผ่น'],'พื้นที่คางหมู = (6 + 4)/2 × 1 = 5 ตารางเมตร กระเบื้อง 1 แผ่น = 0.25 ตารางเมตร จึงใช้ 5 ÷ 0.25 = 20 แผ่น'),
TQ('ระดับความสูงและมุม','ออมเงยหน้าขึ้นไปบนท้องฟ้ามองเห็นโดรนอยู่ตรงแนวเดียวกับยอดต้นไม้พอดี ถ้าออมสูง 150 เซนติเมตรและยืนอยู่ห่างจากต้นไม้ 2 เมตร ซึ่งต้นไม้สูง 4.5 เมตร ถ้าระยะห่างระหว่างออมกับแนวดิ่งของโดรนห่างกัน 100 เมตร โดรนอยู่สูงจากพื้นดินกี่เมตร','151.50 เมตร',['150 เมตร','152 เมตร','154.50 เมตร'],'ความชันของแนวสายตาผ่านยอดต้นไม้ = (4.5 − 1.5)/2 = 1.5 ที่ระยะ 100 เมตร สูงจากสายตา 150 เมตร สูงจากพื้น 1.5 + 150 = 151.5 เมตร'),
TQ('มัธยฐานและพิสัย','ข้อมูลชุดหนึ่งเรียงจากน้อยไปมาก ดังนี้ 98 100 101 104 109 109 110 111 a ถ้าพิสัยของข้อมูลชุดนี้เท่ากับ 14 แล้วค่าเฉลี่ยเลขคณิตของข้อมูลชุดนี้เท่ากับข้อใด','106',['105','107','109'],'พิสัย a − 98 = 14 ได้ a = 112 ผลรวม 954 ÷ 9 = 106'),
TQ('ความน่าจะเป็น','ช่องยูทูป (YouTube) ช่องหนึ่ง จัดกิจกรรมแจกบัตรคอนเสิร์ตจำนวน 5 ใบ ให้กับผู้เข้าร่วมกิจกรรมไลฟ์สด โดยแจกคนละไม่เกิน 1 ใบ ถ้ามีผู้เข้าร่วมกิจกรรมทั้งหมด 60 คน แล้วความน่าจะเป็นของผู้ที่ไม่ได้รับรางวัลเป็นเท่าใด','11/12',['1/6','5/6','1/12'],'ผู้ได้รับรางวัล 5 คน ไม่ได้รับ 55 คน ความน่าจะเป็น = 55/60 = 11/12'),
NQ('เลขยกกำลัง','(10xy³z⁵)^(1/2) × (160x⁻³y⁻⁴z⁻⁵)^(1/2) ÷ (4x⁻²y⁻¹)^(1/2) มีค่าเท่าใด','20',[6,8,10],'ภายในรากตัวเศษเป็น 1,600x⁻²y⁻¹ จึงได้ √1600 ÷ √4 = 40 ÷ 2 = 20'),
NQ('สมการ','สวนสัตว์แห่งหนึ่งคิดค่าเข้าชมสำหรับผู้ใหญ่คนละ 120 บาท และสำหรับเด็กคนละ 50 บาท วันเสาร์ที่ผ่านมาสวนสัตว์นี้เก็บค่าเข้าชมได้ทั้งหมด 162,500 บาท และมีเด็กเข้าชมมากกว่าผู้ใหญ่ 360 คน ในวันเสาร์ที่ผ่านมาสวนสัตว์นี้มีผู้ใหญ่เข้าชมทั้งหมดกี่คน','850 คน',[950,700,1000],'ให้ผู้ใหญ่ = A เด็ก = A + 360 ได้ 120A + 50(A + 360) = 162,500 จึง A = 850'),

<script>
(function(){

let sb = null;
try { if (window.supabase && SB_URL.startsWith('https://')) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch(e) { console.error(e); }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const WEAK = ['123456','111111','000000','123123','12345678','password','qwerty','abc123'];
const CATS = ['ทั่วไป','หยาบคาย','การเมือง','ชื่อบุคคลสำคัญ','ชื่อไม่เหมาะสม','กำหนดเอง'];
let ME = null, MODE = 'quick', weakOK = false;
try { ME = JSON.parse(localStorage.getItem('onet_me') || 'null'); } catch(e) {}

async function rpc(fn, args){
  if(!sb) throw new Error('ยังไม่ได้เชื่อม Supabase (ใส่ URL และ anon key ในไฟล์)');
  const {data, error} = await sb.rpc(fn, args); if(error) throw new Error(error.message); return data; }
function save(d){ ME = d; try { d ? localStorage.setItem('onet_me', JSON.stringify(d)) : localStorage.removeItem('onet_me'); } catch(e) {} refresh(); }
let pendAdm = false;
function isAdm(){ let a = false; try { a = (typeof ADM !== 'undefined') && ADM; } catch(e) {} return a || !!(ME && ME.role === 'admin'); }
function refresh(){ $('acc-btn').textContent = ME ? ME.username : 'เข้าสู่ระบบ'; $('adm-btn').style.display = isAdm() ? 'block' : 'none'; if(!isAdm()) $('adm').classList.remove('on'); }
setInterval(refresh, 400);

/* ---------- บัญชีผู้ใช้ ---------- */
function openAcc(){ renderAcc(); $('acc').classList.add('on'); }
function closeAcc(){ pendAdm = false; $('acc').classList.remove('on'); }

function renderAcc(){

    if($('go-adm')) $('go-adm').onclick = () => { closeAcc(); openAdm(); };
    $('b-slip').onclick = () => $('slip').style.display = 'block';
    $('slip-go').onclick = sendSlip;

    $('b-x').onclick = closeAcc;

  }
  const hint = pendAdm ? '<p class="m" style="margin:0 0 8px">เข้าสู่ระบบด้วยบัญชีแอดมิน (ที่สร้างไว้ในฐานข้อมูล) เพื่อดูข้อมูลทั้งหมด</p>' : '';
  const tab = (k, t) => `<button class="o${MODE === k ? ' s' : ''}" data-m="${k}">${t}</button>`;
  box.innerHTML = hint + `<div class="chips" style="margin-bottom:12px">${tab('quick','สมัครรวดเร็ว')}${tab('perm','สมัครถาวร')}${tab('login','เข้าสู่ระบบ')}</div>

async function submit(){
  const u = $('f-u').value.trim(), p = $('f-p').value, w = $('w');
  w.textContent = '';
  try{
    if(!u) throw new Error('กรุณาใส่ชื่อผู้ใช้');
    if(MODE === 'perm'){
      if(p.length < 6) throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัว');
      if(WEAK.includes(p) && !weakOK){ weakOK = true; w.textContent = 'รหัสนี้เดาได้ง่ายมาก แนะนำให้เปลี่ยน ถ้าต้องการใช้รหัสนี้ กดสมัครอีกครั้ง'; return; }
    }
    const d = MODE === 'login'
      ? await rpc('login_user', {p_username: u, p_password: p})
      : await rpc('register_user', {p_username: u, p_password: MODE === 'perm' ? p : null, p_type: MODE === 'perm' ? 'perm' : 'quick'});
    if(!d || !d.id) throw new Error('เซิร์ฟเวอร์ไม่ตอบกลับ ลองใหม่อีกครั้ง');
    save(d);
    const goAdm = pendAdm; closeAcc();
    if(goAdm && ME && ME.role === 'admin') openAdm();
  }catch(e){ w.textContent = e.message; }
}

async function sendSlip(){
  const w = $('w'); w.textContent = '';
  try{
    const f = $('slip-f').files[0];
    if(!sb) throw new Error('ยังไม่ได้เชื่อม Supabase');
    if(!f) throw new Error('เลือกรูปสลิปก่อน');
    if(f.size > 5e6) throw new Error('ไฟล์ใหญ่เกิน 5 MB');
    const path = crypto.randomUUID() + '.' + (f.name.split('.').pop() || 'jpg');
    const up = await sb.storage.from('slips').upload(path, f, {contentType: f.type});
    if(up.error) throw new Error(up.error.message);
    const url = sb.storage.from('slips').getPublicUrl(path).data.publicUrl;
    await rpc('submit_slip', {p_user: ME.id, p_url: url});
    w.textContent = 'ส่งสลิปแล้ว';
  }catch(e){ w.textContent = e.message; }
}

    </div>
    <div id="rng"></div>
    <h2 style="margin-top:18px">ผู้เข้าใช้รายชั่วโมง</h2>
    <input type="date" id="hd" value="${today}" style="max-width:220px">
    <div id="hbars"></div>
    <h2 style="margin-top:18px">คะแนนเฉลี่ย แยกกลุ่ม</h2>
    <table><tr><th>กลุ่ม</th><th>วิชา</th><th>จำนวนครั้ง</th><th>เฉลี่ย %</th></tr>
      ${S.scores.map(s => `<tr><td>${esc(s.group)}</td><td>${esc(s.subject)}</td><td>${s.n}</td><td>${s.avg}</td></tr>`).join('') || '<tr><td colspan="4">ยังไม่มีข้อมูล</td></tr>'}
    </table>
    <p>รวมทั้งหมด ${S.score_total.n} ครั้ง · เฉลี่ย ${S.score_total.avg ?? '-'} %</p>`;
  const showRange = k => {
    const rows = S[k] || [];
    $('rng').innerHTML = `<table><tr><th>ช่วงเวลา</th><th>จำนวนผู้เข้าใช้ (ครั้ง)</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.label)}</td><td>${r.count}</td></tr>`).join('') || '<tr><td colspan="2">ยังไม่มีข้อมูล</td></tr>'}</table>`;
  };
  b.querySelectorAll('[data-r]').forEach(x => x.onclick = () => showRange(x.dataset.r));
  showRange('day');
  const drawHour = async () => {
    try{
      const arr = await rpc('admin_hourly', {p_admin: ME.id, p_date: $('hd').value});
      const mx = Math.max(1, ...arr);
      $('hbars').innerHTML = `<div class="hbar">${arr.map((c, h) => `<div style="height:${c/mx*100}%" title="${h}:00 = ${c} ครั้ง"><b>${c || ''}</b></div>`).join('')}</div>
        <div class="hlab">${arr.map((_, h) => `<div>${h}</div>`).join('')}</div>`;
    }catch(e){ $('hbars').textContent = e.message; }
  };
  $('hd').onchange = drawHour;
  drawHour();
}

async function loadAnn(){
  const b = $('adm-body');
  b.innerHTML = `<h2>ปล่อยประกาศ / ข้อสอบ PDF</h2>
    <input id="an-t" placeholder="หัวข้อ"><textarea id="an-b" rows="3" placeholder="รายละเอียด"></textarea>
    <input type="file" id="an-f" accept="application/pdf">
    <div class="chips"><button class="p" id="an-go">ปล่อย</button></div>
    <div class="warn" id="an-w"></div>
    <h2 style="margin-top:16px">ประกาศที่ปล่อยแล้ว</h2><div id="an-list">กำลังโหลด...</div>`;
  $('an-go').onclick = postAnn;
  try{
    const L = await rpc('list_announcements', {});
    $('an-list').innerHTML = L.map(a => `<div class="card"><b>${esc(a.title)}</b>
      <small class="m"> ${new Date(a.created_at).toLocaleString('th-TH')}</small>
      <p>${esc(a.body)}</p>${a.file_url ? `<a href="${esc(a.file_url)}" target="_blank" rel="noopener">ดาวน์โหลด PDF</a>` : ''}</div>`).join('') || 'ยังไม่มี';
  }catch(e){ $('an-list').textContent = e.message; }
}

async function postAnn(){
  const w = $('an-w'); w.textContent = '';
  try{
    const t = $('an-t').value.trim();
    if(!t) throw new Error('ใส่หัวข้อก่อน');
    if(!sb) throw new Error('ยังไม่ได้เชื่อม Supabase');
    let url = null;
    const f = $('an-f').files[0];
    if(f){
      const path = crypto.randomUUID() + '.pdf';
      const up = await sb.storage.from('exam-files').upload(path, f, {contentType: 'application/pdf'});
      if(up.error) throw new Error(up.error.message);
      url = sb.storage.from('exam-files').getPublicUrl(path).data.publicUrl;
    }
    await rpc('admin_post_announcement', {p_admin: ME.id, p_title: t, p_body: $('an-b').value, p_file_url: url});
    loadAnn();
  }catch(e){ w.textContent = e.message; }
}

async function loadSlips(){
  const b = $('adm-body'); b.innerHTML = 'กำลังโหลด...';
  try{
    const L = await rpc('admin_list_slips', {p_admin: ME.id});
    b.innerHTML = '<h2>สลิปการโอนที่ส่งเข้ามา</h2>' + (L.map(s => `<div class="card"><b>${esc(s.user)}</b>
      <small class="m"> ${new Date(s.at).toLocaleString('th-TH')}</small><br>
      <a href="${esc(s.url)}" target="_blank" rel="noopener"><img src="${esc(s.url)}" style="max-width:220px;border-radius:8px;margin-top:6px"></a></div>`).join('') || 'ยังไม่มีสลิป');
  }catch(e){ b.textContent = e.message; }
}

async function loadBans(){
  const b = $('adm-body'); b.innerHTML = 'กำลังโหลด...';
  try{
    const L = await rpc('admin_list_bans', {p_admin: ME.id});
    b.innerHTML = `<h2>ตั้งค่าชื่อต้องห้าม</h2>
      <p class="m">เพิ่มได้ทีละหลายชื่อ โดยขึ้นบรรทัดใหม่ทุกชื่อ</p>
      <textarea id="bn-t" rows="4" placeholder="เช่น ฮิตเลอร์ (ขึ้นบรรทัดใหม่แต่ละชื่อ)"></textarea>
      <select id="bn-m"><option value="contains">ห้ามเมื่อมีคำนี้อยู่ในชื่อ</option><option value="exact">ห้ามเฉพาะชื่อที่ตรงเป๊ะ</option></select>
      <input list="cats" id="bn-c" value="ทั่วไป" placeholder="หมวด">
      <datalist id="cats">${CATS.map(c => `<option value="${c}">`).join('')}</datalist>
      <div class="chips"><button class="p" id="bn-go">เพิ่มชื่อ</button></div>
      <div class="warn" id="bn-w"></div>
      <table><tr><th>ชื่อ</th><th>แบบ</th><th>หมวด</th><th>สถานะ</th></tr>
        ${L.map(x => `<tr><td>${esc(x.pattern)}</td><td>${x.match_type === 'exact' ? 'ตรงเป๊ะ' : 'มีคำนี้'}</td><td>${esc(x.category)}</td>
        <td><button class="o" data-id="${x.id}" data-on="${x.enabled}">${x.enabled ? 'เปิดอยู่ (กดเพื่อปิด)' : 'ปิดอยู่ (กดเพื่อเปิด)'}</button></td></tr>`).join('')}
      </table>`;
    $('bn-go').onclick = addBans;
    b.querySelectorAll('[data-id]').forEach(x => x.onclick = async () => {
      try{ await rpc('admin_toggle_ban', {p_admin: ME.id, p_id: +x.dataset.id, p_enabled: x.dataset.on !== 'true'}); loadBans(); }
      catch(e){ $('bn-w').textContent = e.message; }
    });
  }catch(e){ b.textContent = e.message; }
}

async function addBans(){
  const w = $('bn-w'); w.textContent = '';
  try{
    const items = $('bn-t').value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!items.length) throw new Error('ใส่ชื่ออย่างน้อย 1 ชื่อ');
    for(const p of items)
      await rpc('admin_add_ban', {p_admin: ME.id, p_pattern: p, p_match: $('bn-m').value, p_category: $('bn-c').value.trim() || 'กำหนดเอง'});
    loadBans();
  }catch(e){ w.textContent = e.message; }
}

/* ---------- ให้หน้าข้อสอบเรียกบันทึกคะแนน ----------
   ตัวอย่าง: recordScore('math', 'ครูสมชาย', คะแนนที่ได้, คะแนนเต็ม) */
window.recordScore = (subject, group, score, total) =>
  ME && rpc('record_score', {p_user: ME.id, p_subject: subject, p_group: group, p_score: score, p_total: total}).catch(() => {});
/* ครอบฟังก์ชัน result() เดิม: เมื่อจบข้อสอบ บันทึกคะแนนของผู้ที่ล็อกอิน (กลุ่ม = อาจารย์/นักเรียน ตามที่เลือกตอนเข้าเมนู) */
if(typeof window.result === 'function'){
  const _res = window.result;
  window.result = function(){
    _res.apply(this, arguments);
    try{
      if(!ME || !S || !S.qs) return;
      const sc = S.qs.filter((q, i) => judge(q, S.ans[i]).ok).length;
      window.recordScore(NAV.sn || 'ทั่วไป', NAV.role === 'teacher' ? 'อาจารย์' : 'นักเรียน', sc, S.qs.length);
    }catch(e){ console.error(e); }
  };
}

/* ---------- เริ่มต้น ---------- */
refresh();
rpc('log_visit', {p_user: ME ? ME.id : null}).catch(() => {});
})();
</script>
